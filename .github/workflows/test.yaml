name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Run tests
        run: |
          cd test
          make clean
          make
          # make will return success even if the tests fail, so check results.xml for failed tests
          python -m cocotb_tools.check_results results.xml

      # Extra: the Icarus testbench of this project (bit-exact model, 20 000 random samples)
      - name: Run Icarus testbench
        shell: bash
        run: |
          mkdir -p sim/build
          RTL="src/pid_sync.v src/pid8_tick.v src/pid8_regs.v src/pid8_core.v src/tt_um_duarte_diamantino_pid8.v"
          iverilog -g2005 -Wall -s tt_um_duarte_diamantino_pid8 -o /dev/null $RTL
          iverilog -g2012 -Wall -Wno-timescale -s tb_pid8 -o sim/build/tb_rtl.vvp sim/tb_pid8.v $RTL
          vvp -n sim/build/tb_rtl.vvp +N=20000 | tee sim/build/tb_rtl.log
          grep -q "TEST PASSED" sim/build/tb_rtl.log

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*
            sim/build/tb_rtl.log
